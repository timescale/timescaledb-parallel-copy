name: Lint PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint-pr-title:
    uses: timescale/cloud-actions/.github/workflows/lint-pr-title.yaml@main
    with:
      runner: ubuntu-latest
